<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewcount Guessr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep:      #0d0d0f;
      --bg-card:      #18181b;
      --bg-hover:     #1f1f23;
      --border:       #2a2a2f;
      --accent:       #9147ff;
      --accent-light: #b77dff;
      --accent-glow:  rgba(145,71,255,0.35);
      --accent-dim:   rgba(145,71,255,0.12);
      --green:        #00e5a0;
      --yellow:       #ffcc00;
      --red:          #ff4d6d;
      --text-primary: #efeff1;
      --text-muted:   #adadb8;
      --text-dim:     #5a5a6e;
      --radius:       12px;
      --radius-sm:    8px;
      --shadow:       0 8px 40px rgba(0,0,0,0.6);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg-deep); color: var(--text-primary);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(145,71,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(145,71,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none; z-index: 0;
    }
    .wrapper { position: relative; z-index: 1; width: 100%; max-width: 1200px; padding: 0 16px 80px; }

    /* HEADER */
    header { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 28px 0 20px; }
    .logo-icon { width: 38px; height: 38px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px var(--accent-glow); flex-shrink: 0; }
    .logo-icon svg { width: 20px; height: 20px; fill: #fff; }
    h1 { font-family: 'Bebas Neue', cursive; font-size: clamp(1.8rem,5vw,3rem); letter-spacing: 0.04em; line-height: 1; }
    h1 span { color: var(--accent); }

    .screen { display: none; flex-direction: column; }
    .screen.active { display: flex; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }

    /* ══ LOGIN ══ */
    #screen-login { align-items: center; gap: 24px; padding: 16px 0 40px; }
    .login-card { padding: 40px 44px; max-width: 420px; width: 100%; text-align: center; }
    .login-card h2 { font-family: 'Bebas Neue', cursive; font-size: 1.8rem; letter-spacing: 0.05em; margin-bottom: 10px; }
    .login-card > p { color: var(--text-muted); font-size: 0.8rem; line-height: 1.7; margin-bottom: 32px; }
    .btn-twitch-login { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 15px 24px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-family: 'Bebas Neue', cursive; font-size: 1.2rem; letter-spacing: 0.08em; cursor: pointer; transition: all 0.18s; box-shadow: 0 4px 24px rgba(145,71,255,0.5); }
    .btn-twitch-login:hover:not(:disabled) { background: var(--accent-light); transform: translateY(-2px); }
    .btn-twitch-login:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-twitch-login svg { width: 20px; height: 20px; fill: #fff; flex-shrink: 0; }
    .login-divider { display: flex; align-items: center; gap: 12px; margin: 22px 0; color: var(--text-dim); font-size: 0.72rem; }
    .login-divider::before, .login-divider::after { content:''; flex:1; height:1px; background: var(--border); }
    .login-info { display: flex; align-items: flex-start; gap: 10px; margin-top: 24px; padding: 12px 14px; text-align: left; background: var(--bg-hover); border-radius: var(--radius-sm); font-size: 0.72rem; color: var(--text-dim); line-height: 1.55; }
    .login-info svg { width: 15px; height: 15px; fill: var(--text-dim); flex-shrink: 0; margin-top: 1px; }

    /* ══ MENU ══ */
    #screen-menu { align-items: center; gap: 28px; padding: 16px 0 40px; }
    .menu-card { padding: 36px 44px; text-align: center; max-width: 460px; width: 100%; }
    .menu-card h2 { font-family: 'Bebas Neue', cursive; font-size: 1.7rem; letter-spacing: 0.05em; margin-bottom: 8px; }
    .menu-card > p { color: var(--text-muted); font-size: 0.8rem; line-height: 1.6; margin-bottom: 20px; }
    .user-badge { display: flex; align-items: center; gap: 12px; background: var(--bg-hover); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 20px; text-align: left; }
    .user-badge img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .user-badge-name { font-size: 0.85rem; color: var(--text-primary); font-weight: 500; }
    .user-badge-sub { font-size: 0.67rem; color: var(--text-dim); margin-top: 2px; }
    .round-label { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-dim); margin-bottom: 10px; }
    .round-options { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
    .round-btn { width: 64px; height: 50px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); font-family: 'Bebas Neue', cursive; font-size: 1.4rem; cursor: pointer; transition: all 0.18s; }
    .round-btn:hover { border-color: var(--accent-light); color: var(--accent-light); background: var(--accent-dim); }
    .round-btn.active { border-color: var(--accent); color: #fff; background: var(--accent); box-shadow: 0 0 16px var(--accent-glow); }

    /* BUTTONS */
    .btn-primary { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 13px 30px; font-family: 'Bebas Neue', cursive; font-size: 1.05rem; letter-spacing: 0.08em; cursor: pointer; transition: all 0.18s; box-shadow: 0 4px 18px var(--accent-glow); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-light); transform: translateY(-2px); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary { display: inline-flex; align-items: center; gap: 8px; background: transparent; color: var(--text-muted); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 26px; font-family: 'Bebas Neue', cursive; font-size: 1.05rem; letter-spacing: 0.08em; cursor: pointer; transition: all 0.18s; }
    .btn-secondary:hover { border-color: var(--accent-light); color: var(--accent-light); background: var(--accent-dim); }
    .btn-ghost { background: none; border: none; color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 0.75rem; cursor: pointer; padding: 4px 0; text-decoration: underline; transition: color 0.15s; }
    .btn-ghost:hover { color: var(--text-muted); }
    .btn-menu { display: inline-flex; align-items: center; gap: 7px; background: transparent; color: var(--text-dim); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 14px; font-family: 'DM Mono', monospace; font-size: 0.72rem; cursor: pointer; transition: all 0.18s; }
    .btn-menu:hover { border-color: var(--text-muted); color: var(--text-muted); }
    .btn-menu svg { width: 13px; height: 13px; fill: currentColor; }

    /* ══ GAME SCREEN ══ */
    #screen-game { gap: 16px; padding: 8px 0; }

    .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .round-indicator { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-dim); }
    .round-indicator strong { color: var(--accent-light); font-size: 1rem; }
    .score-box { display: flex; align-items: center; gap: 10px; padding: 7px 16px; }
    .score-box .lbl { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-dim); }
    .score-val { font-family: 'Bebas Neue', cursive; font-size: 1.5rem; color: var(--accent-light); transition: transform .25s cubic-bezier(.34,1.56,.64,1), color .25s; }
    .score-val.bump { transform: scale(1.4); color: #fff; }

    /* ── 2-Spalten-Layout: Stream + Leaderboard ── */
    .game-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 16px;
      align-items: start;
    }
    .game-left { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

    /* Stream Wrap: Thumbnail sofort, Player im Hintergrund */
    .stream-wrap { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: var(--radius); overflow: hidden; background: #000; border: 1px solid var(--border); box-shadow: var(--shadow); }

    /* Thumbnail – sofort sichtbar */
    #stream-thumb {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
      display: block;
      transition: opacity 0.4s;
    }

    /* Thumbnail-Overlay mit Play-Indikator */
    .thumb-overlay {
      position: absolute; inset: 0; z-index: 2;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1) 60%, rgba(0,0,0,0.5) 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .thumb-overlay.hidden { display: none; }

    /* iframe liegt über Thumbnail, startet unsichtbar */
    #twitch-iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border: none;
      opacity: 0; transition: opacity 0.6s;
      z-index: 3;
    }
    #twitch-iframe.ready { opacity: 1; }
    .viewer-blur-bar { position: absolute; top: 0; left: 0; width: 54%; height: 20%; z-index: 8; backdrop-filter: blur(28px) saturate(0.15) brightness(0.85); -webkit-backdrop-filter: blur(28px) saturate(0.15) brightness(0.85); background: rgba(80,30,160,0.15); pointer-events: none; transition: opacity 0.3s; }
    :fullscreen .viewer-blur-bar, :-webkit-full-screen .viewer-blur-bar { position: fixed; top: 0; left: 0; width: 54vw; height: 12vh; z-index: 2147483647; }
    .viewer-blur-bar.hidden { opacity: 0; pointer-events: none; }
    .stream-loading { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: #0d0d0f; transition: opacity 0.5s; }
    .stream-loading.hidden { opacity: 0; pointer-events: none; }
    .spin-ring { width: 44px; height: 44px; border: 3px solid rgba(145,71,255,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-txt { font-size: 0.73rem; color: var(--text-dim); letter-spacing: 0.08em; }
    .result-overlay { position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,0.82); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
    .result-overlay.visible { display: flex; }
    .overlay-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.18em; color: rgba(255,255,255,0.55); }
    .overlay-viewers { font-family: 'Bebas Neue', cursive; font-size: clamp(3rem,8vw,5.5rem); color: var(--green); line-height: 1; text-shadow: 0 0 50px rgba(0,229,160,0.6); animation: zoomIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes zoomIn { from{opacity:0;transform:scale(0.5)} to{opacity:1;transform:scale(1)} }
    .overlay-sub { font-size: 0.7rem; color: rgba(255,255,255,0.35); letter-spacing: 0.1em; margin-top: 4px; }

    .stream-meta { display: flex; align-items: center; gap: 12px; padding: 0 4px; flex-wrap: wrap; }
    .live-badge { display: flex; align-items: center; gap: 6px; background: #e91916; color: #fff; font-size: 0.62rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
    .stream-name { font-size: 0.9rem; color: var(--text-primary); font-weight: 500; }
    .stream-game { margin-left: auto; font-size: 0.72rem; color: var(--text-muted); }

    /* Guess Panel */
    .guess-panel { padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; }
    .guess-title { font-family: 'Bebas Neue', cursive; font-size: 1.1rem; letter-spacing: 0.06em; color: var(--text-muted); }
    .input-row { display: flex; gap: 12px; align-items: stretch; }
    .guess-input { flex: 1; background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-family: 'Bebas Neue', cursive; font-size: 1.7rem; letter-spacing: 0.05em; padding: 10px 18px; outline: none; text-align: center; transition: border-color 0.18s, box-shadow 0.18s; -moz-appearance: textfield; }
    .guess-input::-webkit-outer-spin-button, .guess-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .guess-input::placeholder { color: var(--text-dim); }
    .guess-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .guess-input:disabled { opacity: 0.4; cursor: not-allowed; }
    .result-area { display: none; flex-direction: column; gap: 14px; }
    .result-area.visible { display: flex; }
    .reveal-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .reveal-block { display: flex; flex-direction: column; gap: 4px; }
    .reveal-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-dim); }
    .reveal-val { font-family: 'Bebas Neue', cursive; font-size: 1.7rem; letter-spacing: 0.04em; }
    .reveal-val.actual { color: var(--green); }
    .reveal-val.guess { color: var(--text-muted); }
    .feedback-badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 999px; font-size: 0.76rem; font-weight: 500; letter-spacing: 0.06em; animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes popIn { from{opacity:0;transform:scale(0.65)} to{opacity:1;transform:scale(1)} }
    .feedback-badge.perfect { background:rgba(0,229,160,0.15); color:var(--green); border:1px solid rgba(0,229,160,0.3); }
    .feedback-badge.great { background:rgba(145,71,255,0.15); color:var(--accent-light); border:1px solid rgba(145,71,255,0.3); }
    .feedback-badge.good { background:rgba(255,204,0,0.12); color:var(--yellow); border:1px solid rgba(255,204,0,0.3); }
    .feedback-badge.miss { background:rgba(255,77,109,0.12); color:var(--red); border:1px solid rgba(255,77,109,0.3); }
    .pts-gained { font-family: 'Bebas Neue', cursive; font-size: 1.3rem; color: var(--accent-light); animation: slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .acc-bar-wrap { height: 5px; background: var(--bg-deep); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
    .acc-bar { height: 100%; border-radius: 99px; transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }
    .action-row { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }

    /* Fehler */
    .error-box { display: none; flex-direction: column; align-items: center; gap: 12px; padding: 36px 20px; text-align: center; }
    .error-box.visible { display: flex; }
    .err-icon { font-size: 2.4rem; }
    .err-title { font-family: 'Bebas Neue', cursive; font-size: 1.4rem; color: var(--red); }
    .err-msg { font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; max-width: 380px; }

    /* ══ LEADERBOARD (rechte Spalte) ══ */
    .leaderboard {
      display: flex; flex-direction: column; gap: 12px;
      position: sticky; top: 16px;
    }

    .lb-card { padding: 16px; }

    .lb-title {
      font-family: 'Bebas Neue', cursive; font-size: 1rem; letter-spacing: 0.08em;
      color: var(--text-muted); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .lb-title svg { width: 14px; height: 14px; fill: var(--accent-light); }

    /* Einzelne Leaderboard-Einträge */
    .lb-row {
      display: grid; grid-template-columns: 22px 1fr auto;
      gap: 8px; align-items: center;
      padding: 7px 8px; border-radius: var(--radius-sm);
      transition: background 0.15s;
      animation: fadeInRow 0.3s ease;
    }
    @keyframes fadeInRow { from{opacity:0;transform:translateX(8px)} to{opacity:1;transform:translateX(0)} }
    .lb-row:hover { background: var(--bg-hover); }
    .lb-row.streamer { background: var(--accent-dim); border: 1px solid rgba(145,71,255,0.2); }
    .lb-row.streamer .lb-pts { color: var(--accent-light); }

    .lb-rank { font-family: 'Bebas Neue', cursive; font-size: 0.9rem; color: var(--text-dim); text-align: center; }
    .lb-rank.gold   { color: #ffd700; }
    .lb-rank.silver { color: #c0c0c0; }
    .lb-rank.bronze { color: #cd7f32; }

    .lb-name { font-size: 0.75rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-name .you { font-size: 0.6rem; color: var(--accent-light); margin-left: 4px; }

    .lb-pts { font-family: 'Bebas Neue', cursive; font-size: 1rem; color: var(--green); }
    .lb-pts.bump { animation: ptsBump 0.4s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes ptsBump { 0%{transform:scale(1)} 50%{transform:scale(1.4);color:#fff} 100%{transform:scale(1)} }

    .lb-empty { font-size: 0.72rem; color: var(--text-dim); text-align: center; padding: 16px 0; line-height: 1.6; }

    /* Chat-Status-Badge */
    .chat-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.65rem; color: var(--text-dim); padding: 0 2px;
    }
    .chat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
    .chat-dot.connected { background: var(--green); animation: blink 1.5s ease-in-out infinite; }
    .chat-dot.error { background: var(--red); }

    /* Runden-Guess-Übersicht (kleine Chips) */
    .round-guesses {
      display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto;
    }
    .round-guesses::-webkit-scrollbar { width: 3px; }
    .round-guesses::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .rg-row {
      display: grid; grid-template-columns: 1fr auto auto;
      gap: 6px; align-items: center;
      font-size: 0.7rem; padding: 4px 8px;
      border-radius: 4px; background: var(--bg-hover);
      animation: fadeInRow 0.25s ease;
    }
    .rg-name { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rg-guess { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; color: var(--text-primary); }
    .rg-pts { font-family: 'Bebas Neue', cursive; font-size: 0.85rem; color: var(--accent-light); }
    .rg-pts.pending { color: var(--text-dim); }

    /* ══ RESULTS ══ */
    #screen-results { gap: 22px; padding: 8px 0 40px; }
    .results-hdr { text-align: center; padding: 28px 0 12px; }
    .results-hdr h2 { font-family: 'Bebas Neue', cursive; font-size: clamp(2rem,8vw,3.2rem); letter-spacing: 0.06em; line-height: 1; margin-bottom: 8px; }
    .big-score-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 8px 0; }
    .big-score-wrap .lbl { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-dim); }
    .big-score { font-family: 'Bebas Neue', cursive; font-size: clamp(2.8rem,10vw,4.5rem); color: var(--accent-light); line-height: 1; text-shadow: 0 0 40px var(--accent-glow); }
    .rank-txt { font-size: 0.82rem; color: var(--text-m
